---
# Verified: postfinance publishes the chart as an official OCI artifact on ghcr.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubelet-csr-approver
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.2.1 # Renovate will bump (current line is ~1.2.x)
  url: oci://ghcr.io/postfinance/charts/kubelet-csr-approver
